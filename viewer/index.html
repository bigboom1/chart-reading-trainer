<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>读图训练</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: #111;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    -webkit-overflow-scrolling: touch;
  }

  /* 顶部栏 */
  header {
    width: 100%;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  header h1 { font-size: 15px; font-weight: 600; color: #f5a623; }

  select, input[type="number"] {
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 13px;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: auto;
    flex-wrap: wrap;
  }
  .header-controls label { font-size: 12px; color: #aaa; }

  .preset-btn {
    background: #333;
    color: #aaa;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .preset-btn:hover { background: #444; color: #fff; }
  .preset-btn.active { background: #f5a623; color: #000; border-color: #f5a623; }

  /* 主画布区 */
  #canvas-area {
    flex: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    min-height: 0;
  }

  #image-container {
    position: relative;
    max-width: 100%;
    max-height: 100%;
    display: inline-block;
  }

  #image-container img {
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 180px);
    width: auto;
    height: auto;
    object-fit: contain;
  }

  /* 遮罩层 */
  #mask-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    clip-path: inset(0 0 0 0);
    pointer-events: none;
  }

  /* 底部控制栏 */
  footer {
    width: 100%;
    background: #1a1a1a;
    border-top: 1px solid #333;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }

  /* 进度条行 */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .reveal-btn {
    background: #f5a623;
    color: #000;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .reveal-btn:hover { background: #f7b84a; }
  .reveal-btn:active { background: #d4900f; }

  #progress-bar {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 8px;
    border-radius: 4px;
    background: #333;
    outline: none;
    cursor: pointer;
  }
  #progress-bar::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #f5a623;
    cursor: pointer;
  }

  #progress-text { font-size: 13px; color: #aaa; min-width: 42px; text-align: right; }

  /* 导航行 */
  .nav-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .nav-btn {
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .nav-btn:hover { background: #3a3a3a; }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  #page-indicator { font-size: 13px; color: #888; }

  #goto-area {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #goto-area label { font-size: 12px; color: #888; }
  #goto-page-input {
    width: 56px;
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 13px;
    text-align: center;
  }
  #goto-btn {
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  #goto-btn:hover { background: #3a3a3a; }

  /* 快捷键提示 */
  .hint {
    text-align: center;
    font-size: 11px;
    color: #555;
    margin-top: 2px;
  }

  /* 感悟输入框 */
  #notes-area {
    margin-top: 6px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  #notes-area label { font-size: 12px; color: #888; }
  #notes-input {
    flex: 1;
    min-width: 200px;
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  #notes-input:focus {
    outline: none;
    border-color: #f5a623;
  }
  #save-note-btn {
    background: #f5a623;
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
  }
  #save-note-btn:hover { background: #f7b84a; }
  #note-status {
    font-size: 11px;
    color: #555;
    min-width: 60px;
  }
</style>
</head>
<body>

<header>
  <h1>📈 读图训练</h1>

  <label>版本:</label>
  <select id="version-select">
    <option value="v2024.3.1">v2024.3.1 (121页)</option>
    <option value="v2024.4.1">v2024.4.1 (102页)</option>
    <option value="ali-gpt1">Ali闪卡 GPT第1部分 (1-165)</option>
    <option value="ali-d2">Ali闪卡 Deepseek第2部分 (166-323)</option>
    <option value="ali-d3">Ali闪卡 Deepseek第3部分 (324-480)</option>
    <option value="ali-d4">Ali闪卡 Deepseek第4部分 (481-638)</option>
    <option value="ali-d5">Ali闪卡 Deepseek第5部分 (639-802)</option>
  </select>

  <div class="header-controls">
    <label>分割数:</label>
    <input type="number" id="slices-input" value="32" min="4" max="256" step="4" style="width:60px">
    <div id="slice-presets" style="display:flex;gap:4px;">
      <button class="preset-btn" data-value="16">16</button>
      <button class="preset-btn" data-value="32">32</button>
      <button class="preset-btn" data-value="64">64</button>
      <button class="preset-btn" data-value="128">128</button>
      <button class="preset-btn" data-value="200">200</button>
    </div>
    <label>揭示幅度:</label>
    <input type="number" id="step-input" value="1" min="1" max="16" step="1" style="width:50px">
  </div>
</header>

<div id="canvas-area">
  <div id="image-container">
    <img id="chart-img" src="" alt="chart">
    <div id="mask-layer"></div>
  </div>
</div>

<footer>
  <div class="progress-row">
    <button class="reveal-btn" id="reveal-btn" title="揭示 (→)">➜</button>
    <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.5">
    <span id="progress-text">0%</span>
  </div>
  <div class="nav-row">
    <button class="nav-btn" id="prev-btn">◀ 上一页</button>
    <span id="page-indicator">— / —</span>
    <button class="nav-btn" id="next-btn">下一页 ▶</button>
    <button class="nav-btn" id="reset-btn">🔄 重置</button>
    <div id="goto-area">
      <label>跳转:</label>
      <input type="number" id="goto-page-input" min="1" placeholder="页码">
      <button class="nav-btn" id="goto-btn">跳转</button>
    </div>
  </div>
  <div class="hint">快捷键: ←→ 翻页 | Space/→ 揭示 | R 重置</div>
  <div id="notes-area">
    <label>感悟:</label>
    <input type="text" id="notes-input" placeholder="记录本页的读图感悟...">
    <button id="save-note-btn">保存</button>
    <span id="note-status"></span>
  </div>
</footer>

<script>
(function() {
  const CONFIG = {
    v2024_3_1: 121,
    v2024_4_1: 102,
    ali_gpt1: 165,
    ali_d2: 158,
    ali_d3: 157,
    ali_d4: 158,
    ali_d5: 164
  };

  const basePath = '../assets/pages-sm/';
  let currentVersion = 'v2024.3.1';
  let currentPage = 1;
  let currentReveal = 0;
  let slices = 32;
  let step = 1;

  // 感悟存储 (localStorage)
  const notesKey = 'chart_trainer_notes';

  function loadNotes() {
    try {
      return JSON.parse(localStorage.getItem(notesKey) || '{}');
    } catch { return {}; }
  }

  function saveNotes(notes) {
    localStorage.setItem(notesKey, JSON.stringify(notes));
  }

  function getNoteKey() {
    return `${currentVersion}_${currentPage}`;
  }

  // DOM
  const imgEl       = document.getElementById('chart-img');
  const maskEl      = document.getElementById('mask-layer');
  const pBar        = document.getElementById('progress-bar');
  const pText       = document.getElementById('progress-text');
  const pageInd     = document.getElementById('page-indicator');
  const verSelect   = document.getElementById('version-select');
  const slicesInput = document.getElementById('slices-input');
  const stepInput   = document.getElementById('step-input');
  const presetBtns  = document.querySelectorAll('.preset-btn');
  const prevBtn     = document.getElementById('prev-btn');
  const nextBtn     = document.getElementById('next-btn');
  const resetBtn    = document.getElementById('reset-btn');
  const revealBtn   = document.getElementById('reveal-btn');
  const gotoInput   = document.getElementById('goto-page-input');
  const gotoBtn     = document.getElementById('goto-btn');
  const notesInput  = document.getElementById('notes-input');
  const saveNoteBtn = document.getElementById('save-note-btn');
  const noteStatus  = document.getElementById('note-status');

  // ---------- 路径 ----------
  function imgSrc(ver, page) {
    return `${basePath}${ver}/page_${String(page).padStart(3,'0')}.png`;
  }

  // ---------- 加载页面 ----------
  function loadPage() {
    imgEl.src = imgSrc(currentVersion, currentPage);
    currentReveal = 0;
    updateReveal();
    updateNavButtons();
    pageInd.textContent = `${currentPage} / ${CONFIG[currentVersion.replace(/\./g, '_').replace(/-/g, '_')]}`;
    loadNote();
  }

  function updateNavButtons() {
    const total = CONFIG[currentVersion.replace(/\./g, '_').replace(/-/g, '_')];
    prevBtn.disabled = currentPage <= 1;
    nextBtn.disabled = currentPage >= total;
  }

  // ---------- 揭示逻辑 ----------
  function updateReveal() {
    maskEl.style.clipPath = `inset(0 0 0 ${currentReveal}%)`;
    pBar.value = currentReveal;
    pText.textContent = `${Math.round(currentReveal)}%`;
  }

  function doReveal() {
    if (currentReveal >= 100) return;
    currentReveal = Math.min(100, currentReveal + (100 / slices) * step);
    updateReveal();
  }

  function doReset() {
    currentReveal = 0;
    updateReveal();
  }

  // ---------- 感悟 ----------
  function loadNote() {
    const notes = loadNotes();
    notesInput.value = notes[getNoteKey()] || '';
    noteStatus.textContent = '';
  }

  function saveNote() {
    const key = getNoteKey();
    const notes = loadNotes();
    if (notesInput.value.trim()) {
      notes[key] = notesInput.value.trim();
      noteStatus.textContent = '✓ 已保存';
    } else {
      delete notes[key];
      noteStatus.textContent = '✓ 已删除';
    }
    saveNotes(notes);
    setTimeout(() => { noteStatus.textContent = ''; }, 2000);
  }

  // ---------- 事件 ----------
  verSelect.addEventListener('change', () => {
    currentVersion = verSelect.value;
    const total = CONFIG[currentVersion.replace(/\./g, '_').replace(/-/g, '_')];
    if (currentPage > total) currentPage = total;
    loadPage();
  });

  slicesInput.addEventListener('change', () => {
    slices = parseInt(slicesInput.value) || 32;
    updatePresetActive();
  });

  function updatePresetActive() {
    presetBtns.forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.dataset.value) === slices);
    });
  }

  presetBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      slices = parseInt(btn.dataset.value);
      slicesInput.value = slices;
      updatePresetActive();
    });
  });

  stepInput.addEventListener('change', () => {
    step = parseInt(stepInput.value) || 1;
  });

  revealBtn.addEventListener('click', doReveal);
  resetBtn.addEventListener('click', doReset);
  saveNoteBtn.addEventListener('click', saveNote);

  prevBtn.addEventListener('click', () => {
    if (currentPage > 1) { currentPage--; loadPage(); }
  });

  nextBtn.addEventListener('click', () => {
    const total = CONFIG[currentVersion.replace(/\./g, '_').replace(/-/g, '_')];
    if (currentPage < total) { currentPage++; loadPage(); }
  });

  pBar.addEventListener('input', () => {
    currentReveal = parseFloat(pBar.value);
    updateReveal();
  });

  // 跳转
  gotoBtn.addEventListener('click', () => {
    const targetPage = parseInt(gotoInput.value);
    const total = CONFIG[currentVersion.replace(/\./g, '_').replace(/-/g, '_')];
    if (targetPage && targetPage >= 1 && targetPage <= total) {
      currentPage = targetPage;
      loadPage();
      gotoInput.value = '';
    }
  });

  gotoInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') gotoBtn.click();
  });

  // 点击图片区域揭示
  document.getElementById('canvas-area').addEventListener('click', (e) => {
    if (e.target === revealBtn || e.target.closest('button')) return;
    doReveal();
  });

  // 键盘快捷键
  document.addEventListener('keydown', (e) => {
    // 跳过输入框的快捷键
    if (e.target.tagName === 'INPUT') return;
    switch(e.key) {
      case 'ArrowRight':
        doReveal();
        break;
      case 'ArrowLeft':
        currentReveal = Math.max(0, currentReveal - (100 / slices) * step);
        updateReveal();
        break;
      case ' ':
        e.preventDefault();
        doReveal();
        break;
      case 'ArrowUp':
        {
          const total = CONFIG[currentVersion.replace(/\./g, '_').replace(/-/g, '_')];
          if (currentPage < total) { currentPage++; loadPage(); }
        }
        break;
      case 'ArrowDown':
        if (currentPage > 1) { currentPage--; loadPage(); }
        break;
      case 'r':
      case 'R':
        doReset();
        break;
    }
  });

  // 初始化
  updatePresetActive();
  loadPage();
  doReset();
})();
</script>
</body>
</html>
