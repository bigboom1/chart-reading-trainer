<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>读图训练</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    user-select: none;
  }

  /* 顶部栏 */
  header {
    width: 100%;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  header h1 { font-size: 16px; font-weight: 600; color: #f5a623; }

  select, input[type="number"] {
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 13px;
  }

  .header-controls { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  .header-controls label { font-size: 12px; color: #aaa; }

  /* 主画布区 */
  #canvas-area {
    flex: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }

  #image-container {
    position: relative;
    max-width: 100%;
    max-height: 100%;
    display: inline-block;
  }

  #image-container img {
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 160px);
    width: auto;
    height: auto;
    object-fit: contain;
  }

  /* 遮罩层 — 用 CSS clip-path 实现左→右渐显 */
  #mask-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    clip-path: inset(0 0 0 0);
    pointer-events: none;
  }

  /* 底部控制栏 */
  footer {
    width: 100%;
    background: #1a1a1a;
    border-top: 1px solid #333;
    padding: 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
  }

  /* 进度条行 */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .reveal-btn {
    background: #f5a623;
    color: #000;
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .reveal-btn:hover { background: #f7b84a; }
  .reveal-btn:active { background: #d4900f; }

  #progress-bar {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 8px;
    border-radius: 4px;
    background: #333;
    outline: none;
    cursor: pointer;
  }
  #progress-bar::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #f5a623;
    cursor: pointer;
  }

  #progress-text { font-size: 13px; color: #aaa; min-width: 42px; text-align: right; }

  /* 导航行 */
  .nav-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .nav-btn {
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 7px 18px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .nav-btn:hover { background: #3a3a3a; }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  #page-indicator { font-size: 13px; color: #888; }

  /* 快捷键提示 */
  .hint {
    text-align: center;
    font-size: 11px;
    color: #555;
    margin-top: 2px;
  }

  /* 点击提示 */
  #click-hint {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.75);
    color: #f5a623;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 14px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 10;
  }
  #click-hint.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>📈 读图训练</h1>

  <label>版本:</label>
  <select id="version-select">
    <option value="v2024.3.1">v2024.3.1 (121页)</option>
    <option value="v2024.4.1">v2024.4.1 (102页)</option>
  </select>

  <div class="header-controls">
    <label>分割数:</label>
    <input type="number" id="slices-input" value="32" min="4" max="128" step="4" style="width:60px">
    <label>揭示幅度:</label>
    <input type="number" id="step-input" value="1" min="1" max="16" step="1" style="width:50px">
  </div>
</header>

<div id="canvas-area">
  <div id="image-container">
    <img id="chart-img" src="" alt="chart">
    <div id="mask-layer"></div>
  </div>
  <div id="click-hint">点击揭示 ➜</div>
</div>

<footer>
  <div class="progress-row">
    <button class="reveal-btn" id="reveal-btn" title="揭示 (→)">➜</button>
    <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.5">
    <span id="progress-text">0%</span>
  </div>
  <div class="nav-row">
    <button class="nav-btn" id="prev-btn">◀ 上一页</button>
    <span id="page-indicator">— / —</span>
    <button class="nav-btn" id="next-btn">下一页 ▶</button>
    <button class="nav-btn" id="reset-btn">🔄 重置</button>
  </div>
  <div class="hint">快捷键: ←→ 翻页 | Space/→ 揭示 | R 重置</div>
</footer>

<script>
(function() {
  const CONFIG = {
    v2024_3_1: 121,
    v2024_4_1: 102
  };

  const basePath = '../assets/pages-sm/';
  let currentVersion = 'v2024.3.1';
  let currentPage = 1;
  let currentReveal = 0; // 0~100
  let slices = 32;
  let step = 1;

  const imgEl       = document.getElementById('chart-img');
  const maskEl      = document.getElementById('mask-layer');
  const pBar        = document.getElementById('progress-bar');
  const pText       = document.getElementById('progress-text');
  const pageInd     = document.getElementById('page-indicator');
  const verSelect   = document.getElementById('version-select');
  const slicesInput = document.getElementById('slices-input');
  const stepInput   = document.getElementById('step-input');
  const prevBtn     = document.getElementById('prev-btn');
  const nextBtn     = document.getElementById('next-btn');
  const resetBtn    = document.getElementById('reset-btn');
  const revealBtn   = document.getElementById('reveal-btn');
  const clickHint   = document.getElementById('click-hint');

  // ---------- 路径 ----------
  function imgSrc(ver, page) {
    return `${basePath}${ver}/page_${String(page).padStart(3,'0')}.png`;
  }

  // ---------- 加载页面 ----------
  function loadPage() {
    imgEl.src = imgSrc(currentVersion, currentPage);
    currentReveal = 0;
    maskEl.style.display = 'block';
    updateReveal();
    updateNavButtons();
    pageInd.textContent = `${currentPage} / ${CONFIG[currentVersion.replace(/\./g, '_')]}`;
  }

  function updateNavButtons() {
    const total = CONFIG[currentVersion.replace(/\./g, '_')];
    prevBtn.disabled = currentPage <= 1;
    nextBtn.disabled = currentPage >= total;
  }

  // ---------- 揭示逻辑 ----------
  function updateReveal() {
    // clip-path 从右侧收缩，实现左→右显示
    const revealed = currentReveal / 100;
    maskEl.style.clipPath = `inset(0 ${(1 - revealed) * 100}% 0 0)`;
    pBar.value = currentReveal;
    pText.textContent = `${Math.round(currentReveal)}%`;

    // 100% 时完全消失
    if (currentReveal >= 100) {
      maskEl.style.display = 'none';
    } else {
      maskEl.style.display = 'block';
    }
  }

  function doReveal() {
    if (currentReveal >= 100) return;
    currentReveal = Math.min(100, currentReveal + (100 / slices) * step);
    updateReveal();
  }

  function doReset() {
    currentReveal = 0;
    maskEl.style.display = 'block';
    updateReveal();
  }

  // ---------- 事件 ----------
  verSelect.addEventListener('change', () => {
    currentVersion = verSelect.value;
    const total = CONFIG[currentVersion.replace(/\./g, '_')];
    if (currentPage > total) currentPage = total;
    loadPage();
  });

  slicesInput.addEventListener('change', () => {
    slices = parseInt(slicesInput.value) || 32;
  });

  stepInput.addEventListener('change', () => {
    step = parseInt(stepInput.value) || 1;
  });

  revealBtn.addEventListener('click', () => { doReveal(); showHint(); });
  resetBtn.addEventListener('click', doReset);

  prevBtn.addEventListener('click', () => {
    if (currentPage > 1) { currentPage--; loadPage(); }
  });

  nextBtn.addEventListener('click', () => {
    const total = CONFIG[currentVersion.replace(/\./g, '_')];
    if (currentPage < total) { currentPage++; loadPage(); }
  });

  pBar.addEventListener('input', () => {
    currentReveal = parseFloat(pBar.value);
    updateReveal();
  });

  // 点击图片区域揭示
  document.getElementById('canvas-area').addEventListener('click', (e) => {
    if (e.target === revealBtn || e.target.closest('button')) return;
    doReveal();
    showHint();
  });

  // 键盘快捷键
  document.addEventListener('keydown', (e) => {
    switch(e.key) {
      case 'ArrowRight':
        doReveal();
        showHint();
        break;
      case 'ArrowLeft':
        // 后退一点点
        currentReveal = Math.max(0, currentReveal - (100 / slices) * step);
        updateReveal();
        break;
      case ' ':
        e.preventDefault();
        doReveal();
        showHint();
        break;
      case 'ArrowUp':
        {
          const total = CONFIG[currentVersion.replace(/\./g, '_')];
          if (currentPage < total) { currentPage++; loadPage(); }
        }
        break;
      case 'ArrowDown':
        if (currentPage > 1) { currentPage--; loadPage(); }
        break;
      case 'r':
      case 'R':
        doReset();
        break;
    }
  });

  // hint 提示
  let hintTimer;
  function showHint() {
    clickHint.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => clickHint.classList.remove('show'), 1200);
  }

  // 初始化
  loadPage();
  doReset();
})();
</script>
</body>
</html>
